services:
  db:
    image: postgres:15-alpine
    container_name: idle-realms-db
    environment:
      POSTGRES_DB: idlerealms
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: idle-realms-api
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/idlerealms
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true

volumes:
  postgres_data: